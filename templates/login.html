{% extends "base.html" %}

{% block title %}Login | HotelPro{% endblock %}

{% block extra_css %}
<style>
    .auth-login-page {
        min-height: calc(100vh - 48px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .auth-login-card {
        width: 100%;
        max-width: 430px;
    }

    .auth-logo {
        width: 68px;
        height: 68px;
        margin: 0 auto 18px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef2ff;
        color: #4f46e5;
        font-size: 30px;
        box-shadow: 0 10px 25px rgba(79, 70, 229, 0.12);
    }

    .auth-card {
        border-radius: 20px;
        overflow: hidden;
    }

    .auth-card-body {
        padding: 34px;
    }

    .auth-input {
        min-height: 48px;
    }

    .auth-login-btn {
        min-height: 50px;
        border-radius: 10px;
        font-weight: 600;
    }

    .auth-footer {
        text-align: center;
        margin-top: 22px;
    }

    @media (max-width: 576px) {
        .auth-login-page {
            padding: 25px 15px;
        }

        .auth-card-body {
            padding: 25px 20px;
        }
    }
</style>
{% endblock %}


{% block content %}

<div class="auth-login-page">

    <div class="auth-login-card">

        <!-- BRAND -->
        <div class="text-center mb-4">

            <div class="auth-logo">
                <i class="bi bi-buildings-fill"></i>
            </div>

            <div class="small fw-bold text-muted text-uppercase"
                 style="letter-spacing:.16em;">
                HOTELPRO
            </div>

            <h1 class="fw-bold mt-2 mb-2">
                Welcome Back
            </h1>

            <p class="text-muted mb-0">
                Sign in to your management portal
            </p>

        </div>


        <!-- LOGIN CARD -->
        <div class="card border-0 shadow-sm auth-card">

            <div class="auth-card-body">

                <form method="POST">

                    <!-- EMAIL -->
                    <div class="mb-4">

                        <label for="email"
                               class="form-label fw-semibold">
                            Email Address
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>

                            <input type="email"
                                   id="email"
                                   name="email"
                                   class="form-control auth-input"
                                   placeholder="you@example.com"
                                   autocomplete="email"
                                   required>

                        </div>

                    </div>


                    <!-- PASSWORD -->
                    <div class="mb-4">

                        <label for="passwordInput"
                               class="form-label fw-semibold">
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input type="password"
                                   id="passwordInput"
                                   name="password"
                                   class="form-control auth-input"
                                   placeholder="Enter your password"
                                   autocomplete="current-password"
                                   required>

                            <button type="button"
                                    class="btn btn-light border"
                                    id="togglePassword"
                                    aria-label="Show password">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                    </div>


                    <!-- LOGIN BUTTON -->
                    <button type="submit"
                            class="btn btn-primary w-100 auth-login-btn">

                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Sign In

                    </button>

                </form>

            </div>

        </div>


        <!-- REGISTER -->
        <div class="auth-footer">

            <span class="text-muted">
                Don't have an account?
            </span>

            <a href="{{ url_for('auth.register') }}"
               class="fw-semibold text-decoration-none ms-1">
                Create Account
            </a>

        </div>


        <!-- SECURITY -->
        <div class="text-center mt-4">

            <small class="text-muted">

                <i class="bi bi-shield-check me-1"></i>

                Secure Hotel Management Portal

            </small>

        </div>

    </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const passwordInput = document.getElementById("passwordInput");
    const togglePassword = document.getElementById("togglePassword");

    if (!passwordInput || !togglePassword) {
        return;
    }

    togglePassword.addEventListener("click", function () {

        const showPassword = passwordInput.type === "password";

        passwordInput.type = showPassword
            ? "text"
            : "password";

        togglePassword.innerHTML = showPassword
            ? '<i class="bi bi-eye-slash"></i>'
            : '<i class="bi bi-eye"></i>';

    });

});

</script>

{% endblock %}
